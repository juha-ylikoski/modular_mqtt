[package]
name = "mqtt_client"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8.5"
rust-mqtt-protocol = { path = "../mqtt_protocol" }
thiserror = "2.0.11"
tokio = { version = "1.42.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dev-dependencies]
ntest = "0.9.3"
testcontainers = { version = "0.27.3", features = ["blocking"] }
testcontainers-modules = { version = "0.15.0", features = ["mosquitto"] }


